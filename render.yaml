services:
  - type: web
    name: u2xai-license
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: u2xai-licenses
          property: connectionString
      - key: TOKEN_SIGNING_SECRET
        generateValue: true
      - key: TRIAL_DAYS
        value: "30"
      - key: GRACE_HOURS
        value: "72"
      - key: RENEWAL_URL
        value: "https://u2xai.com/renew"
      - key: SUPPORT_EMAIL
        value: "support@u2xai.com"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: "u2xai-course-bundles"

databases:
  - name: u2xai-licenses
    plan: basic-1gb
